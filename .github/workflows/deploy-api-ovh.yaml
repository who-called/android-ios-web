name: "[ovh] Deploy API (OVH)"

# OVH MKS clone of deploy-api-hetzner.yaml. Runs on the OVH self-hosted runner
# and deploys to the OVH cluster. Does NOT touch the Hetzner pipeline. Manual
# trigger only (workflow_dispatch) while validating the OVH terrain.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/hetzner/apps/deployment-api.yaml"
      - ".github/workflows/deploy-api-ovh.yaml"
  workflow_dispatch: {}

concurrency:
  group: whocalled-api-hetzner-ovh
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/whocalled-api
  DEPLOYMENT_NAME: whocalled-api
  NS: whocalled-prod

jobs:
  build:
    name: Build & Push API (GHCR)
    runs-on: [self-hosted, ovh]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-whocalled-api
          cache-to: type=local,dest=/tmp/.buildx-cache-whocalled-api-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-whocalled-api
          mv /tmp/.buildx-cache-whocalled-api-new /tmp/.buildx-cache-whocalled-api || true

  deploy:
    name: Deploy API to OVH MKS
    needs: build
    runs-on: [self-hosted, ovh]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test cluster connection
        run: kubectl get nodes

      # Signing secret for the short-lived /lists tokens. Lives in GitHub
      # Actions secrets → merged into the k8s secret the API already mounts.
      # Rotating it = update the GitHub secret, re-run this workflow (old
      # tokens die within their 15 min TTL anyway).
      - name: Sync LIST_TOKEN_SECRET into whocalled-api-secret
        env:
          LIST_TOKEN_SECRET: ${{ secrets.LIST_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${LIST_TOKEN_SECRET}" ]; then
            echo "::error::GitHub secret LIST_TOKEN_SECRET is not set (repo Settings → Secrets → Actions). Generate one with: openssl rand -hex 32"
            exit 1
          fi
          kubectl -n "$NS" patch secret whocalled-api-secret --type merge \
            -p "{\"stringData\":{\"LIST_TOKEN_SECRET\":\"${LIST_TOKEN_SECRET}\"}}"

      - name: Deploy whocalled-api + scoring cronjob
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${{ github.sha }}"
          echo "Deploying ${DEPLOYMENT_NAME} -> ${IMAGE}"
          sed "s|PLACEHOLDER_IMAGE|${IMAGE}|g" \
            infra/hetzner/apps/deployment-api.yaml | kubectl apply -n "$NS" --validate=false -f -
          sed "s|PLACEHOLDER_IMAGE|${IMAGE}|g" \
            infra/hetzner/apps/cronjob-scoring.yaml | kubectl apply -n "$NS" --validate=false -f -

      - name: Rollout status
        run: kubectl -n "$NS" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=600s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 50 || true
          kubectl -n "$NS" get pods || true

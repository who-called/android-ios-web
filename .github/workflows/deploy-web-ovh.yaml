name: "[ovh] Deploy Web (OVH)"

# OVH MKS clone of deploy-web-hetzner.yaml. Runs on the OVH self-hosted runner
# and deploys to the OVH cluster. Does NOT touch the Hetzner pipeline. Manual
# trigger only (workflow_dispatch) while validating the OVH terrain.
#
# NEXT_PUBLIC_* URLs are baked at build time and stay pointed at the
# who-called.com production subdomains (identical to Hetzner).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "infra/hetzner/apps/deployment-web.yaml"
      - ".github/workflows/deploy-web-ovh.yaml"
  workflow_dispatch: {}

concurrency:
  group: whocalled-web-hetzner-ovh
  cancel-in-progress: true

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/whocalled-web
  DEPLOYMENT_NAME: whocalled-web
  NS: whocalled-prod

jobs:
  build:
    name: Build & Push Web (GHCR)
    runs-on: [self-hosted, ovh]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.who-called.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://www.who-called.com
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache-whocalled-web
          cache-to: type=local,dest=/tmp/.buildx-cache-whocalled-web-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-whocalled-web
          mv /tmp/.buildx-cache-whocalled-web-new /tmp/.buildx-cache-whocalled-web || true

  deploy:
    name: Deploy Web to OVH MKS
    needs: build
    runs-on: [self-hosted, ovh]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test cluster connection
        run: kubectl get nodes

      - name: Deploy whocalled-web
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${{ github.sha }}"
          echo "Deploying ${DEPLOYMENT_NAME} -> ${IMAGE}"
          sed "s|PLACEHOLDER_IMAGE|${IMAGE}|g" \
            infra/hetzner/apps/deployment-web.yaml | kubectl apply -n "$NS" --validate=false -f -

      - name: Rollout status
        run: kubectl -n "$NS" rollout status "deployment/${DEPLOYMENT_NAME}" --timeout=600s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 50 || true
          kubectl -n "$NS" get pods || true

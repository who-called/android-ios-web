# Apex who-called.com -> www.who-called.com redirect, with a real TLS cert.
#
# Ported from infra/hetzner/apps/ingress-apex-redirect.yaml for OVH MKS.
# OVH has NO Traefik, so the Traefik `Middleware` CRD (traefik.io/v1alpha1) +
# redirectRegex is dropped and replaced by the ingress-nginx equivalent:
# the annotation `nginx.ingress.kubernetes.io/permanent-redirect` on the apex
# Ingress issues a 301 to https://www.who-called.com.
#
# Prereq: the apex DNS must point ONLY to the OVH ingress-nginx LoadBalancer IP
# (152.228.144.10) so the ACME HTTP-01 challenge is not hijacked by any stale
# web-forwarding A record. Once the apex resolves only to the cluster, the
# HTTP-01 challenge succeeds and this cert issues.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whocalled-apex
  namespace: whocalled-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ingress-nginx's admission webhook rejects annotation values containing
    # nginx variables like $request_uri (strict validation). Use a static
    # redirect target (apex -> www root). Path-preserving apex redirect can be
    # refined later via from-to-www-redirect on the www ingress if needed.
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.who-called.com"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - who-called.com
      secretName: whocalled-apex-tls
  rules:
    - host: who-called.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whocalled-web
                port:
                  number: 3000

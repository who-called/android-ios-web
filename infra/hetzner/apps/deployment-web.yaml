apiVersion: apps/v1
kind: Deployment
metadata:
  name: whocalled-web
  namespace: whocalled-prod
  labels:
    app: whocalled-web
    managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: whocalled-web
  template:
    metadata:
      labels:
        app: whocalled-web
        managed-by: kustomize
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      restartPolicy: Always
      containers:
        - name: whocalled-web
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
